<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051A3A"/>
      <stop offset="50%" stop-color="#021026"/>
      <stop offset="100%" stop-color="#0F2B5C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8"/>
  
  <!-- Inner Glowing Circle -->
  <circle cx="256" cy="230" r="140" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="4" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
  
  <!-- Golden Royal Crown -->
  <path d="M180 270 L195 190 L230 230 L256 160 L282 230 L317 190 L332 270 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="4"/>
  <circle cx="195" cy="180" r="10" fill="#FFFFFF"/>
  <circle cx="256" cy="150" r="12" fill="#FFFFFF"/>
  <circle cx="317" cy="180" r="10" fill="#FFFFFF"/>
  <rect x="180" y="270" width="152" height="18" rx="6" fill="#78350F"/>
  <circle cx="215" cy="279" r="5" fill="#EF4444"/>
  <circle cx="256" cy="279" r="6" fill="#10B981"/>
  <circle cx="297" cy="279" r="5" fill="#3B82F6"/>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ROYAL SATTA</text>
  <text x="256" y="458" font-family="'Arial', sans-serif" font-size="22" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">OFFICIAL APP</text>
</svg>
